[workspace]
resolver = "3"
members = [
    "hirust-mapper-core",
    "hirust-mapper-runtime",
    "hirust-mapper-macros",
    "hirust-mapper",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# 核心解析依赖
quick-xml = "0.38"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
lazy_static = "1.5"

# 运行时依赖
sqlx = { version = "0.8", default-features = false }
tokio = { version = "1", features = ["full"] }
notify = "7"
toml = "0.8"
thiserror = "2"
glob = "0.3"

# 可选类型处理器（各 crate 内部按需声明 optional）
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# proc_macro 依赖
quote = "1"
proc-macro2 = "1"
syn = { version = "2", features = ["full", "parsing", "extra-traits"] }

[profile.release]
opt-level = 3
